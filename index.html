<!DOCTYPE html>
<html>
  <head>
    <title>AR con marcador personalizado</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.rawgit.com/jeromeetienne/ar.js/2.1.8/aframe/build/aframe-ar.min.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs>
      <a-marker type="pattern" url="patt/pattern.patt">

        <!-- Base -->
        <a-plane rotation="-90 0 0" width="2" height="2" color="#333" opacity="0.3"></a-plane>

        <!-- Modelo 3D -->
        <a-entity gltf-model="modelos/takodachi.glb"
                  position="0 0.1 0"
                  scale="0.05 0.05 0.05"
                  animation="property: rotation; to: 0 360 0; loop: true; dur: 6000">
        </a-entity>

        <!-- Modelo 3D -->
        <a-entity gltf-model="modelos/fireworks_demo___free_download.glb"
                  position="0.5 0.1 -0.3"
                  scale="0.15 0.15 0.15"
                  >
        </a-entity>


        <!-- Texto principal encima del modelo -->
        <a-text value="Hina" 
                position="0 1.5 0.3" 
                color="#FFD700" 
                align="center" 
                scale="2 2 2">
        </a-text>

        <!-- Textos flotantes animados -->
        <a-text value="¡Bienvenida!" 
                color="#FF69B4" 
                position="-1 1.2 0.2" 
                scale="1.5 1.5 1.5"
                animation="property: position; dir: alternate; dur: 2000; easing: easeInOutSine; to: -1 1.8 0.2; loop: true">
        </a-text>

        <a-text value="🎉 Takodachi AR 🎉" 
                color="#00FFFF" 
                position="1 1.2 0.2" 
                scale="1.2 1.2 1.2"
                animation="property: position; dir: alternate; dur: 2000; easing: easeInOutSine; to: 1 1.8 0.2; loop: true">
        </a-text>

        <!-- Fuegos artificiales mejor posicionados -->
        <a-sphere position="0 0.5 0.6" radius="0.07" color="#FFD700"
                  animation__rise="property: position; to: 0 2 0.6; dur: 1800; easing: easeOutCubic; loop: true"
                  animation__fade="property: material.opacity; to: 0; dur: 1800; loop: true">
        </a-sphere>

        <a-sphere position="0.3 0.4 0.5" radius="0.06" color="#FF0000"
                  animation__rise="property: position; to: 0.3 2.2 0.5; dur: 2000; easing: easeOutCubic; loop: true"
                  animation__fade="property: material.opacity; to: 0; dur: 2000; loop: true">
        </a-sphere>

        <a-sphere position="-0.3 0.4 0.4" radius="0.06" color="#00FF00"
                  animation__rise="property: position; to: -0.3 2.1 0.4; dur: 1900; easing: easeOutCubic; loop: true"
                  animation__fade="property: material.opacity; to: 0; dur: 1900; loop: true">
        </a-sphere>

      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>

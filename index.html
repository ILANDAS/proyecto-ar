<!DOCTYPE html>
<html>
  <head>
    <title>AR con marcador personalizado</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.rawgit.com/jeromeetienne/ar.js/2.1.8/aframe/build/aframe-ar.min.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs>
      <a-marker type="pattern" url="patt/pattern.patt">

        <!-- Base -->
        <a-plane rotation="-90 0 0" width="2" height="2" color="#333" opacity="0.3"></a-plane>

        <!-- Modelo principal -->
        <a-entity gltf-model="modelos/takodachi.glb"
                  position="0 0.1 0"
                  scale="0.04 0.04 0.04"
                  atrapar-evento
                  animation="property: scale; dir: alternate; dur: 1000; easing: easeInOutSine; to: 0.08 0.08 0.08; loop: true">
        </a-entity>

        <a-entity id="filtro-alerta" geometry="primitive: plane; height: 10; width: 10"
                  position="0 0 -2"
                  material="color: red; opacity: 0.3"
                  visible="false">
        </a-entity>

        <!-- Modelo adicional: fuegos artificiales (subido para visibilidad) -->
        <a-entity gltf-model="modelos/fireworks_demo___free_download.glb"
                  position="0.5 1.5 -0.3"
                  scale="0.4 0.4 0.4">
        </a-entity>

        <!-- NUEVOS TEXTOS flotando arriba y separados -->
        <a-text value="Me atrapaste"
                position="0 2.5 0.2"
                color="white"
                align="center"
                scale="2.5 2.5 2.5"
                animation="property: position; dir: alternate; dur: 1200; easing: easeInOutSine; to: 0 2.8 0.2; loop: true">
        </a-text>

        <a-text value="¡Oh no!"
                position="0 3.1 0.2"
                color="red"
                align="center"
                scale="2 2 2"
                animation="property: position; dir: alternate; dur: 1500; easing: easeInOutSine; to: 0 3.6 0.2; loop: true">
        </a-text>

        <!-- Fuegos artificiales esferas (más visibles y elevados) -->
        <a-sphere position="0 2.5 0.6" radius="0.07" color="#FFD700"
                  animation__rise="property: position; to: 0 4.2 0.6; dur: 1600; loop: true"
                  animation__fade="property: material.opacity; to: 0; dur: 1600; loop: true">
        </a-sphere>

        <a-sphere position="0.3 2.4 0.5" radius="0.06" color="#FF0000"
                  animation__rise="property: position; to: 0.3 4.1 0.5; dur: 1800; loop: true"
                  animation__fade="property: material.opacity; to: 0; dur: 1800; loop: true">
        </a-sphere>

        <a-sphere position="-0.3 2.4 0.4" radius="0.06" color="#00FF00"
                  animation__rise="property: position; to: -0.3 4.0 0.4; dur: 1700; loop: true"
                  animation__fade="property: material.opacity; to: 0; dur: 1700; loop: true">
        </a-sphere>

      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
    <script>
      AFRAME.registerComponent('atrapar-evento', {
        init: function () {
          const modelo = this.el;
          const escena = document.querySelector('a-scene');
          const overlay = document.querySelector('#filtro-alerta');
    
          // Cambiar color del modelo
          modelo.setAttribute('material', 'color: red; opacity: 0.7');
    
          // Mostrar fondo rojo semitransparente
          overlay.setAttribute('visible', true);
    
          // Ocultar modelo y overlay después de 60s
          setTimeout(() => {
            modelo.setAttribute('visible', false);
            overlay.setAttribute('visible', false);
    
            // Mostrar +1 punto
            const texto = document.createElement('a-text');
            texto.setAttribute('value', '+1 punto');
            texto.setAttribute('position', '0 1.5 0.3');
            texto.setAttribute('color', 'lime');
            texto.setAttribute('scale', '2 2 2');
            texto.setAttribute('align', 'center');
            texto.setAttribute('animation', 'property: position; to: 0 2.5 0.3; dur: 1500; easing: easeOutElastic; dir: alternate; loop: true');
    
            escena.appendChild(texto);
          }, 60000);
        }
      });
    </script>
  </body>
</html>

<!DOCTYPE html>
<html>
  <head>
    <title>AR con marcador personalizado</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.rawgit.com/jeromeetienne/ar.js/2.1.8/aframe/build/aframe-ar.min.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs>
      <!-- Marcador -->
      <a-marker type="pattern" url="patt/pattern.patt">
        
        <!-- Modelo 3D con animación de escala -->
        <a-entity id="muñeco"
                  gltf-model="modelos/takodachi.glb"
                  position="0 0.1 0"
                  scale="0.04 0.04 0.04"
                  animation="property: scale; dir: alternate; dur: 1000; easing: easeInOutSine; to: 0.08 0.08 0.08; loop: true">
        </a-entity>

        <!-- NUEVOS TEXTOS flotando arriba y separados -->
        <a-text value="Me atrapaste"
                position="0 2.5 0.2"
                color="white"
                align="center"
                scale="2.5 2.5 2.5"
                animation="property: position; dir: alternate; dur: 1200; easing: easeInOutSine; to: 0 2.8 0.2; loop: true">
        </a-text>

        <a-text value="¡Oh no!"
                position="0 3.1 0.2"
                color="red"
                align="center"
                scale="2 2 2"
                animation="property: position; dir: alternate; dur: 1500; easing: easeInOutSine; to: 0 3.6 0.2; loop: true">
        </a-text>

      </a-marker>

      <!-- Cámara -->
      <a-entity camera></a-entity>

      <!-- Filtro rojo -->
      <a-entity id="filtro-rojo"
                geometry="primitive: plane; height: 100; width: 100"
                position="0 0 -5"
                material="color: red; opacity: 0.4"
                visible="false">
      </a-entity>
    </a-scene>

    <!-- Script de lógica AR -->
    <script>
      AFRAME.registerComponent('activar-efecto', {
        init: function () {
          const modelo = document.querySelector('#muñeco');
          const overlay = document.querySelector('#filtro-rojo');
          const escena = document.querySelector('a-scene');
          let efectoActivado = false;

          this.el.addEventListener('markerFound', () => {
            if (efectoActivado) return;
            efectoActivado = true;

            // Cambiar color y opacidad del modelo
            modelo.setAttribute('material', 'color: red; opacity: 0.7');

            // Mostrar el filtro rojo
            overlay.setAttribute('visible', true);

            // Después de 60 segundos
            setTimeout(() => {
              modelo.setAttribute('visible', false);
              overlay.setAttribute('visible', false);

              // Mostrar texto +1 punto
              const texto = document.createElement('a-text');
              texto.setAttribute('value', '+1 punto');
              texto.setAttribute('position', '0 2 0.3');
              texto.setAttribute('color', 'lime');
              texto.setAttribute('scale', '2 2 2');
              texto.setAttribute('align', 'center');
              texto.setAttribute('animation', 'property: position; to: 0 2.5 0.3; dur: 1500; dir: alternate; loop: true; easing: easeOutElastic');

              escena.appendChild(texto);
            }, 60000);
          });
        }
      });

      // Aplica el componente a la escena
      document.querySelector('a-scene').setAttribute('activar-efecto', '');
    </script>
  </body>
</html>

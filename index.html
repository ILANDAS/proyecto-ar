<!DOCTYPE html>
<html>
  <head>
    <title>AR con marcador personalizado</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.rawgit.com/jeromeetienne/ar.js/2.1.8/aframe/build/aframe-ar.min.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs>
      <!-- Usa el marcador Hiro o cambia "hiro" por el nombre de tu marcador personalizado -->
      <a-marker type="pattern" url="patt/pattern.patt">
        <a-plane rotation="-90 0 0" width="2" height="2" color="#333" opacity="0.3"></a-plane>
      
       <a-entity gltf-model="modelos/takodachi.glb"
          position="0 0.1 0"
          scale="0.08 0.08 0.08"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 6000">
        </a-entity>
      
        <!-- Texto flotante animado -->
        <a-text value="¡Bienvenida!" 
        color="#FF69B4" 
        position="-1 1 0" 
        scale="1.5 1.5 1.5"
        animation="property: position; dir: alternate; dur: 2000; easing: easeInOutSine; to: -1 1.5 0; loop: true">
        </a-text>

        <a-text value="🎉 Takodachi AR 🎉" 
        color="#00FFFF" 
        position="1 1 0" 
        scale="1.2 1.2 1.2"
        animation="property: position; dir: alternate; dur: 2000; easing: easeInOutSine; to: 1 1.5 0; loop: true">
        </a-text>

        <!-- Fuego artificial 1 -->
        <a-sphere position="0 0.2 0.5" radius="0.05" color="#FFD700"
        animation__rise="property: position; to: 0 2 0.5; dur: 1500; easing: easeOutCubic; loop: true"
        animation__fade="property: material.opacity; to: 0; dur: 1500; loop: true">
        </a-sphere>

        <!-- Fuego artificial 2 -->
        <a-sphere position="0.2 0.2 0.3" radius="0.05" color="#FF0000"
        animation__rise="property: position; to: 0.2 1.8 0.3; dur: 1800; easing: easeOutCubic; loop: true"
        animation__fade="property: material.opacity; to: 0; dur: 1800; loop: true">
        </a-sphere>

        <!-- Fuego artificial 3 -->
        <a-sphere position="-0.2 0.2 0.4" radius="0.05" color="#00FF00"
        animation__rise="property: position; to: -0.2 2.2 0.4; dur: 1700; easing: easeOutCubic; loop: true"
        animation__fade="property: material.opacity; to: 0; dur: 1700; loop: true">
        </a-sphere>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
